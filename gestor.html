<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcaz SaaS - Painel Gestor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style id="gestorThemeStyle">
    :root {
      --bg-body: #0a0b0e;
      --bg-card: #14161f;
      --primary: #00e5ff;
      --accent: #ff3b30;
      --success: #34c759;
      --text-main: #ffffff;
      --text-muted: #8e8ea0;
      --border: #222533;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    .navbar { background: #10121a; border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .brand { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .brand span { color: var(--primary); font-size: 0.78rem; display: block; font-weight: normal; margin-top: 2px; }
    
    .container { padding: 15px; max-width: 1400px; margin: 0 auto; width: 100%; flex: 1; }

    .input-group { text-align: left; margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.78rem; color: var(--primary); font-weight: bold; margin-bottom: 5px; }
    .input-box { width: 100%; background: #0a0b0e; border: 1px solid var(--border); color: #fff; padding: 11px; border-radius: 8px; font-size: 0.88rem; outline: none; }

    .btn-primary { width: 100%; background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
    .btn-header { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }

    .gestor-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: none; border: 1px solid transparent; color: var(--text-muted); padding: 10px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
    .tab-btn.active { background: rgba(0, 229, 255, 0.1); border-color: var(--primary); color: var(--primary); }

    .table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
    .table-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

    .item-list-row { background: #0c0e14; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size:0.85rem; }

    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:99; }
    .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 25px; width: 90%; max-width: 420px; text-align: left; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="brand">Marcaz SaaS - Painel Gestor<span>Barbearia VIP (Logado: Sena)</span></div>
    <button class="btn-header" onclick="window.location.href='admin.html'">⚡ Marcaz Control</button>
  </div>

  <div class="container">
    <div class="gestor-tabs">
      <button class="tab-btn active" onclick="switchTab('agendamentos')">📅 Agendamentos</button>
      <button class="tab-btn" onclick="switchTab('config')">⚙️ Configurações</button>
      <button class="tab-btn" onclick="switchTab('equipe')">👥 Profissionais</button>
    </div>

    <!-- TAB AGENDAMENTOS COM BOTÃO DE CLIENTE AVULSO -->
    <div id="secAgendamentos">
      <div class="table-card">
        <div class="table-title">
          <span>Próximos Agendamentos</span>
          <div>
            <button class="btn-primary" style="width: auto; padding: 6px 12px; font-size: 0.8rem; margin-right: 8px;" onclick="openAvulsoModal()">👤 + Cliente Avulso</button>
            <button class="btn-header">🔄 Atualizar</button>
          </div>
        </div>
        
        <div id="gestorBookingList">
          <div class="item-list-row">
            <div>
              <strong>⏰ 10:30 - Cliente AV - Sena</strong>
              <div style="font-size:0.75rem; color:var(--text-muted);">Corte / Cabelo (45 min) - Profissional: Sena</div>
            </div>
            <span style="color:var(--primary); font-weight:bold;">R$ 40,00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB CONFIGURAÇÕES -->
    <div id="secConfig" style="display:none;">
      <div class="table-card">
        <div class="table-title">⏰ Dias e Horários de Atendimento</div>
        <p style="font-size:0.8rem; color:var(--text-muted);">Horário normal configurado: 08:00 às 19:00.</p>
      </div>
    </div>

    <!-- TAB EQUIPE -->
    <div id="secEquipe" style="display:none;">
      <div class="table-card">
        <div class="table-title">👥 Profissionais</div>
        <p style="font-size:0.8rem; color:var(--text-muted);">Sena, Ana</p>
      </div>
    </div>

  </div>

  <!-- MODAL PARA AGENDAMENTO DE CLIENTE AVULSO -->
  <div class="modal-overlay" id="modalAvulso">
    <div class="modal-content">
      <h3 style="margin-bottom:12px; font-size:1.1rem; color:var(--primary);">👤 Agendar Cliente Avulso</h3>
      
      <div class="input-group">
        <label>Serviço Desejado:</label>
        <select id="avServico" class="input-box">
          <option value="Corte / Cabelo">Corte / Cabelo (R$ 40,00)</option>
          <option value="Barba / Design">Barba / Design (R$ 30,00)</option>
        </select>
      </div>

      <div class="input-group">
        <label>Profissional Atendente:</label>
        <select id="avProfissional" class="input-box">
          <option value="Sena">Sena</option>
          <option value="Ana">Ana</option>
        </select>
      </div>

      <div class="input-group">
        <label>Horário de Atendimento:</label>
        <select id="avHorario" class="input-box">
          <option value="10:45">10:45 (Agora)</option>
          <option value="11:15">11:15</option>
          <option value="14:00">14:00</option>
          <option value="15:30">15:30</option>
        </select>
      </div>

      <button class="btn-primary" onclick="confirmAvulsoBooking()">Confirmar Agendamento Avulso</button>
      <button class="btn-primary" style="background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--border); margin-top:8px;" onclick="closeAvulsoModal()">Cancelar</button>
    </div>
  </div>

  <script>
    var currentStaffName = 'Sena';

    function switchTab(t) {
      document.getElementById('secAgendamentos').style.display = t === 'agendamentos' ? 'block' : 'none';
      document.getElementById('secConfig').style.display = t === 'config' ? 'block' : 'none';
      document.getElementById('secEquipe').style.display = t === 'equipe' ? 'block' : 'none';
    }

    function openAvulsoModal() { document.getElementById('modalAvulso').style.display = 'flex'; }
    function closeAvulsoModal() { document.getElementById('modalAvulso').style.display = 'none'; }

    function confirmAvulsoBooking() {
      var serv = document.getElementById('avServico').value;
      var pro = document.getElementById('avProfissional').value;
      var hora = document.getElementById('avHorario').value;

      var container = document.getElementById('gestorBookingList');
      var item = document.createElement('div');
      item.className = 'item-list-row';
      item.innerHTML = '<div><strong>⏰ ' + hora + ' - Cliente AV - ' + currentStaffName + '</strong><div style="font-size:0.75rem; color:var(--text-muted);">' + serv + ' - Profissional: ' + pro + '</div></div><span style="color:var(--primary); font-weight:bold;">Agendado</span>';
      
      container.insertBefore(item, container.firstChild);
      closeAvulsoModal();
      alert('Agendamento de Cliente Avulso inserido na lista!');
    }
  </script>
</body>
</html>
