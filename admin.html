<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcaz Control - Gestão Mestre Multi-Empresas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-body: #07080b;
      --bg-card: #12141c;
      --primary: #00e5ff;
      --accent: #ff3b30;
      --success: #34c759;
      --text-main: #ffffff;
      --text-muted: #8e8ea0;
      --border: #202333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); padding: 25px; }

    .header-control { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 25px; }
    .header-title { font-size: 1.3rem; font-weight: bold; }
    .header-title span { color: var(--primary); font-size: 0.8rem; display: block; }

    .grid-control { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card-control { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }

    .input-box { width: 100%; background: #07080b; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; outline: none; }
    .btn-action { width: 100%; background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    .btn-danger { background: var(--accent); color: #fff; }
    .btn-demo { background: rgba(0, 229, 255, 0.1); border: 1px solid var(--primary); color: var(--primary); }

    .badge-active { background: rgba(52, 199, 89, 0.2); color: #52ff88; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; }
    .badge-blocked { background: rgba(255, 59, 48, 0.2); color: #ff7066; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="header-control">
    <div class="header-title">
      ⚡ Marcaz Control - Módulo Mestre
      <span>JHOVIS TECNOLOGIA - GESTÃO DE SAAS MULTI-TENANT</span>
    </div>
    <a href="index.html" style="color: var(--primary); font-weight: bold; text-decoration: none; font-size: 0.85rem;">← Ver Visão do Cliente</a>
  </div>

  <div class="grid-control">
    
    <!-- CARD 1: SELEÇÃO DE EMPRESAS & BLOQUEIO INDIVIDUAL -->
    <div class="card-control">
      <h3 style="margin-bottom: 15px; font-size: 1rem;">🏢 Empresas Parceiras</h3>
      <label style="font-size: 0.75rem; color: var(--primary); font-weight: bold;">Selecione a Empresa:</label>
      <select id="selEmpresa" class="input-box" onchange="updateEmpresaStatusView()">
        <option value="empresa_1">Barbearia VIP - Várzea da Palma (Ativo)</option>
        <option value="empresa_2">Salão Divas - Belo Horizonte (Ativo)</option>
        <option value="empresa_3">Studio Plena - Uberlândia (Bloqueado)</option>
      </select>

      <div style="margin-bottom: 15px;">
        <span style="font-size: 0.8rem;">Status Atual: </span>
        <span id="lblStatusEmpresa" class="badge-active">ATIVO</span>
      </div>

      <button class="btn-action btn-danger" onclick="toggleEmpresaStatus('bloquear')">🔒 Bloquear Acesso Individual</button>
      <button class="btn-action" onclick="toggleEmpresaStatus('ativar')">🔓 Reativar Acesso Individual</button>
    </div>

    <!-- CARD 2: CADASTRAR NOVA EMPRESA -->
    <div class="card-control">
      <h3 style="margin-bottom: 15px; font-size: 1rem;">➕ Cadastrar Nova Empresa / Licença</h3>
      <input type="text" id="newEmpNome" class="input-box" placeholder="Razão Social / Nome Fantasia">
      <input type="text" id="newEmpDoc" class="input-box" placeholder="CNPJ ou CPF do Proprietário">
      <input type="email" id="newEmpEmail" class="input-box" placeholder="E-mail de Acesso do Gestor">
      <button class="btn-action" onclick="cadastrarNovaEmpresa()">Criar Licença SaaS</button>
    </div>

    <!-- CARD 3: MODO APRESENTAÇÃO COMERCIAL & RESTAURAÇÃO DE DEMO -->
    <div class="card-control">
      <h3 style="margin-bottom: 15px; font-size: 1rem;">🎯 Modo Apresentação & Demonstração</h3>
      <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px;">Apresente modelos fictícios sem alterar dados reais:</p>
      
      <button class="btn-action btn-demo" onclick="openDemo('barbearia_noel')">💈 Barbearia Noel (Demonstração)</button>
      <button class="btn-action btn-demo" onclick="openDemo('salao_divas')">💅 Salão Divas (Demonstração)</button>
      <button class="btn-action btn-demo" onclick="openDemo('studio_plena')">✨ Studio Plena (Demonstração)</button>
      
      <hr style="border-color: var(--border); margin: 15px 0;">
      
      <button class="btn-action btn-danger" onclick="resetDemoData()">🔄 Restaurar Backup Fixo de Testes</button>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://joadjyqxvpfhgnihezyp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_RL7vh5enh_hCuM-QZtgefg_Y4dt0Mys';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let empresaStatuses = {
      'empresa_1': 'ATIVO',
      'empresa_2': 'ATIVO',
      'empresa_3': 'BLOQUEADO'
    };

    function updateEmpresaStatusView() {
      const sel = document.getElementById('selEmpresa').value;
      const st = empresaStatuses[sel] || 'ATIVO';
      const lbl = document.getElementById('lblStatusEmpresa');
      lbl.innerText = st;
      lbl.className = st === 'ATIVO' ? 'badge-active' : 'badge-blocked';
    }

    function toggleEmpresaStatus(action) {
      const sel = document.getElementById('selEmpresa').value;
      empresaStatuses[sel] = action === 'bloquear' ? 'BLOQUEADO' : 'ATIVO';
      updateEmpresaStatusView();
      alert(`Status da empresa selecionada alterado com sucesso para: ${empresaStatuses[sel]}`);
    }

    function cadastrarNovaEmpresa() {
      const nome = document.getElementById('newEmpNome').value;
      if (!nome) return alert('Informe o nome da empresa.');
      alert(`Nova licença criada com sucesso para: ${nome}`);
    }

    function openDemo(type) {
      window.open('index.html?demo=' + type, '_blank');
    }

    function resetDemoData() {
      alert('🎉 Dados fictícios das 3 empresas de demonstração restaurados com sucesso para a versão padrão!');
    }
  </script>
</body>
</html>
